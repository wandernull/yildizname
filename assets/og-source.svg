<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Open Graph share card for yıldızna.me — shown on WhatsApp / Twitter /
    Facebook / iMessage previews when someone shares a yildizna.me URL.
    Built via scripts/build-assets.mjs into public/og-image.png at 1200x630.
    Text is rendered with system Georgia (italic + bold) at PNG build
    time — Cormorant Garamond would be the brand-canonical face but
    librvips on macOS doesn't reliably load Google Fonts, and Georgia
    is a close-enough Renaissance-era serif that ships on every OS.
  -->
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogMoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d08a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="ogRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Night-sky background -->
  <rect width="1200" height="630" fill="#0a0e1a"/>

  <!-- Sprinkle of stars (subtle, just enough texture so the canvas
       doesn't read as a flat colour swatch) -->
  <g fill="#f0f4ff" opacity="0.55">
    <circle cx="120" cy="80" r="1.6"/>
    <circle cx="240" cy="140" r="1.1"/>
    <circle cx="80" cy="220" r="1.3"/>
    <circle cx="320" cy="60" r="1.2"/>
    <circle cx="200" cy="380" r="1.5"/>
    <circle cx="60" cy="480" r="1"/>
    <circle cx="340" cy="500" r="1.2"/>
    <circle cx="180" cy="560" r="1.4"/>
    <circle cx="980" cy="100" r="1.5"/>
    <circle cx="1100" cy="170" r="1.2"/>
    <circle cx="860" cy="60" r="1"/>
    <circle cx="1050" cy="320" r="1.4"/>
    <circle cx="930" cy="500" r="1.3"/>
    <circle cx="1130" cy="540" r="1.5"/>
    <circle cx="820" cy="430" r="1.1"/>
    <circle cx="1080" cy="80" r="1"/>
    <circle cx="700" cy="540" r="1.2"/>
    <circle cx="540" cy="80" r="1"/>
    <circle cx="620" cy="540" r="1.3"/>
    <circle cx="780" cy="180" r="1.1"/>
  </g>

  <!-- Soft halo behind the moon -->
  <circle cx="270" cy="315" r="320" fill="url(#ogGlow)"/>

  <!-- Crescent moon on the left side of the card -->
  <path
    d="M 300 165 A 150 150 0 1 0 300 465 A 116 116 0 1 1 300 165 Z"
    fill="url(#ogMoonGrad)"
  />

  <!-- Wordmark + tagline + URL stacked on the right -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8d08a">
    <text
      x="560"
      y="295"
      font-size="92"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
    >Yıldızname</text>

    <!-- Thin gold rule under the wordmark -->
    <line x1="560" y1="325" x2="900" y2="325" stroke="url(#ogRule)" stroke-width="1.2"/>

    <text
      x="560"
      y="380"
      font-size="34"
      font-style="italic"
      fill="#b8c4d4"
      opacity="0.92"
    >Yıldızların altında, harflerin diliyle</text>

    <text
      x="560"
      y="450"
      font-size="22"
      font-style="italic"
      fill="#c9a84c"
      letter-spacing="6"
    >yıldızna.me</text>
  </g>
</svg>
