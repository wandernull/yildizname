<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Yıldızname — Yıldızların altında, harflerin diliyle</title>
    <meta
      name="description"
      content="Klasik yıldızname ve ilm-i hurûf geleneğinden, sana özel bir kader okuması."
    />
    <link rel="canonical" href="https://yildizna.me/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yıldızname — Yıldızların altında, harflerin diliyle" />
    <meta
      property="og:description"
      content="Klasik yıldızname ve ilm-i hurûf geleneğinden, sana özel bir kader okuması."
    />
    <meta property="og:url" content="https://yildizna.me/" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="yıldızna.me" />
    <meta property="og:image" content="https://yildizna.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yıldızna.me — altın hilâl ve ay altında bir yıldızname okuması" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yıldızname" />
    <meta
      name="twitter:description"
      content="Yıldızların altında, harflerin diliyle. Sana özel bir kader okuması."
    />
    <meta name="twitter:image" content="https://yildizna.me/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div id="moon" aria-hidden="true">
      <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.4" />
            <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#c9a84c" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#eef0f3" />
            <stop offset="100%" stop-color="#bdc3cb" />
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="55" fill="url(#moonGlow)" />
        <path d="M 70 18 A 42 42 0 1 0 70 102 A 32 32 0 1 1 70 18 Z" fill="url(#moonBody)" opacity="0.92" />
      </svg>
    </div>
    <div id="shooting-star-host" aria-hidden="true"></div>

    <main id="app">
      <!-- views are populated by /js/views.js -->
    </main>

    <footer class="site-footer">
      <p class="site-footer-legal">
        <a href="/gizlilik">Gizlilik</a>
        <span aria-hidden="true">·</span>
        <a href="/kosullar">Koşullar</a>
        <span aria-hidden="true">·</span>
        <a href="/sss">SSS</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:destek@yildizna.me">İletişim</a>
      </p>
      <p class="site-footer-attribution">
        yıldızna.me, Back of the Envelope B.V. tarafından sunulmaktadır.
      </p>
    </footer>

    <template id="tpl-landing">
      <section class="view view-landing" data-view="landing">
        <p class="brand">yıldızna.me</p>
        <h1 class="shimmer-gold title">Yıldızname</h1>
        <p class="subtitle">Yıldızların altında, harflerin diliyle</p>
        <hr class="gold-rule" />
        <button type="button" class="btn-gold-outline cta-start-journey">
          Yıldıznameni Oku →
        </button>
        <nav class="landing-related" aria-label="Yıldızname hakkında">
          <p class="landing-related-label">Yıldızname hakkında oku</p>
          <ul>
            <li><a href="/yildizname">Yıldızname Nedir?</a></li>
            <li><a href="/ebced">Ebced Hesabı</a></li>
            <li><a href="/muneccim">Müneccim</a></li>
            <li><a href="/menzil">Ayın 28 Menzili</a></li>
          </ul>
        </nav>
      </section>
    </template>

    <template id="tpl-form">
      <section class="view view-form" data-view="form">
        <div class="progress" aria-hidden="true">
          <div class="progress-bar"></div>
        </div>
        <div class="step-host" aria-live="polite"></div>
        <div class="step-nav">
          <button type="button" class="link-btn nav-back" disabled>← Geri</button>
          <button type="button" class="link-btn nav-skip" hidden>Atla</button>
          <button type="button" class="btn-gold-outline nav-next" disabled>İlerle →</button>
        </div>
      </section>
    </template>

    <template id="tpl-loading">
      <section class="view view-loading" data-view="loading">
        <div class="loading-orbit">
          <div class="constellation-host" aria-hidden="true"></div>
          <svg class="moon-phase" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="moonPhaseGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.5" />
                <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.15" />
                <stop offset="100%" stop-color="#c9a84c" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="moonPhaseBody" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#eef0f3" />
                <stop offset="80%" stop-color="#c6ccd5" />
                <stop offset="100%" stop-color="#a8b0bc" />
              </radialGradient>
              <clipPath id="moonPhaseClip">
                <circle cx="100" cy="100" r="60" />
              </clipPath>
            </defs>
            <circle cx="100" cy="100" r="90" fill="url(#moonPhaseGlow)" />
            <circle cx="100" cy="100" r="60" fill="url(#moonPhaseBody)" />
            <!-- Maria — the dark mare patches that make this read as the
                 actual moon rather than a generic disc. Stylized but in
                 roughly the right positions (Imbrium upper-left,
                 Serenitatis upper-middle, Crisium upper-right,
                 Tranquillitatis middle-right, Nubium lower-middle). All
                 clipped to the moon disc and rendered BENEATH the moving
                 phase shadow so they wax and wane naturally. -->
            <g clip-path="url(#moonPhaseClip)">
              <ellipse cx="86" cy="82" rx="13" ry="10" fill="#7a8088" opacity="0.42" />
              <ellipse cx="108" cy="80" rx="8" ry="7" fill="#7a8088" opacity="0.40" />
              <ellipse cx="137" cy="82" rx="5" ry="5" fill="#7a8088" opacity="0.36" />
              <ellipse cx="123" cy="100" rx="7" ry="11" fill="#7a8088" opacity="0.42" />
              <ellipse cx="90" cy="122" rx="11" ry="6" fill="#7a8088" opacity="0.36" />
            </g>
            <g clip-path="url(#moonPhaseClip)">
              <circle
                class="moon-phase-shadow"
                cx="100"
                cy="100"
                r="60"
                fill="#0a0e1a"
              />
            </g>
          </svg>
          <div class="harfler-host" aria-hidden="true"></div>
        </div>
        <p class="loading-primary shimmer-gold"></p>
        <p class="loading-secondary"></p>
        <p class="loading-reassurance">
          Eski usul saatler isterdi; bu okuma 2-3 dakika sürer. Sayfayı bırakma — yıldıznamen burada açılıyor.
        </p>
      </section>
    </template>

    <template id="tpl-result">
      <article class="view view-result" data-view="result">
        <header class="result-header">
          <p class="kapak-sozu"></p>
          <hr class="gold-rule" />
        </header>
        <div class="sections-host"></div>
        <div class="post-actions">
          <div class="post-actions-row">
            <button type="button" class="btn-gold-outline action-listen-all">Baştan Sona Dinle</button>
            <button type="button" class="btn-gold-outline action-print">PDF İndir</button>
            <button type="button" class="btn-gold-outline action-share">Paylaş</button>
          </div>
        </div>
        <nav class="result-new-reading" aria-label="Yeni okuma">
          <a href="/" data-link class="new-reading-link">Yeni bir okuma →</a>
        </nav>

        <!-- Mobile-only sticky CTA. Hidden on desktop via CSS; hidden on
             mobile until the user scrolls past karakterinOzu; hides again
             when the bottom payment block scrolls into view. Tap opens
             the unlock-modal — price is deliberately not on the bar so it
             doesn't break motivation while scrolling. -->
        <div class="sticky-cta" aria-hidden="true">
          <button type="button" class="sticky-cta-trigger">Kalan 9 bölüm →</button>
        </div>

        <!-- Feedback sticky CTA. Paid-only: views.js shows this (and
             hides the unlock sticky) when the reading is unlocked AND no
             feedback has been left yet. Fades in a few seconds after the
             result page mounts so it doesn't interrupt the read. Tap
             opens the feedback modal. Dismissed permanently for this
             reading once feedback is submitted. -->
        <div class="feedback-sticky" aria-hidden="true" hidden>
          <button type="button" class="feedback-sticky-trigger">
            Müneccime bir söz bırak →
          </button>
        </div>

        <!-- Post-payment success card. Lives inside the same overlay
             that the polling spinner uses — we morph the spinner card
             into this content once the webhook confirms the unlock, so
             the dark backdrop stays continuous through the whole
             "ödendi → onaylandı → açıldı" moment. The invoice link only
             appears when the webhook successfully fetched it from
             Stripe (otherwise the customer still has the email). -->
        <template id="tpl-success-card">
          <div class="post-payment-success">
            <h2 class="post-payment-success-title">Mühür kırıldı</h2>
            <p class="post-payment-success-body">
              Yıldıznamenin tamamı açıldı. Aşağıda dokuz bölüm seni bekliyor — müneccim sesiyle dinleyebilirsin.
            </p>
            <a
              class="btn-gold-fill post-payment-invoice"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >Faturayı İndir</a>
            <button type="button" class="btn-gold-outline post-payment-dismiss">
              Yıldıznameyi Oku
            </button>
          </div>
        </template>

        <!-- Reveal modal: opened by the sticky CTA tap. Native <dialog>
             so we get backdrop, focus trap, and ESC-to-close for free. -->
        <dialog class="unlock-modal" aria-labelledby="unlock-modal-title">
          <div class="unlock-modal-content">
            <button
              type="button"
              class="unlock-modal-close"
              aria-label="Kapat"
            >×</button>
            <h2 id="unlock-modal-title" class="unlock-modal-title">Mührü kır</h2>
            <p class="unlock-modal-body">
              Yıldıznamenin geri kalan dokuz bölümü ve müneccim sesiyle baştan sona sesli okuma — hepsi senin için.
            </p>
            <p class="unlock-modal-price">349,99 ₺</p>
            <button type="button" class="btn-gold-fill unlock-modal-cta">
              Kaderinin tamamını aç →
            </button>
            <p class="unlock-modal-error" hidden></p>
          </div>
        </dialog>

        <!-- Feedback modal: opened by the feedback sticky CTA. Native
             <dialog> for backdrop + focus trap + ESC. The form (stars +
             textarea + submit) and the post-submit thank-you state both
             live inside; views.js swaps between them. Rating is required;
             submit stays disabled until at least one star is chosen. -->
        <dialog class="feedback-modal" aria-labelledby="feedback-modal-title">
          <div class="feedback-modal-content">
            <button
              type="button"
              class="feedback-modal-close"
              aria-label="Kapat"
            >×</button>

            <div class="feedback-form">
              <h2 id="feedback-modal-title" class="feedback-modal-title">
                Yıldıznamen nasıldı?
              </h2>
              <p class="feedback-modal-body">Müneccime bir söz bırak.</p>

              <div
                class="feedback-stars"
                role="radiogroup"
                aria-label="Puan"
              >
                <button type="button" class="feedback-star" data-value="1" role="radio" aria-checked="false" aria-label="1 yıldız">★</button>
                <button type="button" class="feedback-star" data-value="2" role="radio" aria-checked="false" aria-label="2 yıldız">★</button>
                <button type="button" class="feedback-star" data-value="3" role="radio" aria-checked="false" aria-label="3 yıldız">★</button>
                <button type="button" class="feedback-star" data-value="4" role="radio" aria-checked="false" aria-label="4 yıldız">★</button>
                <button type="button" class="feedback-star" data-value="5" role="radio" aria-checked="false" aria-label="5 yıldız">★</button>
              </div>

              <textarea
                class="feedback-text"
                rows="4"
                maxlength="2000"
                placeholder="Müneccim'in sözünden ne kaldı sende? (isteğe bağlı)"
              ></textarea>

              <button type="button" class="btn-gold-fill feedback-submit" disabled>
                Müneccime ulaştır
              </button>
              <p class="feedback-error" hidden></p>
            </div>

            <div class="feedback-thanks" hidden>
              <p class="feedback-thanks-mark" aria-hidden="true">✦</p>
              <h2 class="feedback-thanks-title">Sözün müneccime ulaştı.</h2>
              <p class="feedback-thanks-body">Teşekkürler.</p>
              <button type="button" class="btn-gold-outline feedback-thanks-close">
                Kapat
              </button>
            </div>
          </div>
        </dialog>
      </article>
    </template>

    <template id="tpl-error">
      <section class="view view-error" data-view="error">
        <p class="err-msg"></p>
        <a href="/" data-link class="btn-gold-outline">Başa dön</a>
      </section>
    </template>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
